<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Manager</title>

    <script>
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>

    <link rel="stylesheet" href="./assets/fonts/fonts.css" />
    <link rel="stylesheet" href="./tokens.css" />
    <script src="./vendor/tailwind.js"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "var(--primary)",
              "primary-hover": "var(--primary-hover)",
              "on-primary": "var(--on-primary)",
              background: "var(--background)",
              "on-background": "var(--on-background)",
              surface: "var(--surface)",
              border: "var(--border)",
              muted: "var(--muted)",
              errors: "var(--Errors)",
              success: "var(--Success)",
            },
            fontFamily: {
              sans: ["Yekan Bakh", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <script src="./js/storage.js" defer></script>
    <script src="./js/ui.js" defer></script>
    <script src="./js/create.js" defer></script>
    <script src="./js/render.js" defer></script>
    <script src="./js/edit.js" defer></script>
    <script src="./js/state.js" defer></script>
    <script src="./js/main.js" defer></script>
  </head>
 <body>
    <header
      id="app-header"
      class="fixed inset-x-0 top-0 z-30 bg-background text-on-background lg:hidden"
      data-component="app-header"
      data-mobile="true"
      style="--app-canvas: var(--neutral-100)"
    >
      <div
        id="mobile-app-bar"
        class="mx-4 mt-4 flex h-12 items-center justify-between rounded-xl border border-border bg-surface px-3 shadow-[0_1px_3px_rgba(16,24,40,0.06)] lg:hidden"
        data-region="mobile-app-bar"
      >
        <button
          id="sidebar-toggle"
          type="button"
          class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-on-background transition-all duration-200 ease-out hover:bg-primary-hover/10 hover:text-primary-hover active:scale-95 focus:outline-none focus:ring-2 focus:ring-primary-hover/30"
          aria-label="باز کردن منوی کناری"
          aria-controls="app-sidebar"
          aria-expanded="false"
          data-action="toggle-sidebar"
          data-open="false"
        >
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M5 7h14M5 12h14M5 17h14" />
          </svg>
        </button>
        <h1 id="app-title" class="text-[13px] font-extrabold tracking-[-0.01em]">کوئرا لیست</h1>
        <span class="w-6" aria-hidden="true"></span>
      </div>

    </header>

    <aside
      id="app-sidebar"
      class="fixed inset-y-0 right-0 z-40 flex w-72 translate-x-full flex-col border-l border-border bg-surface text-on-background shadow-xl transition-transform duration-300 ease-out data-[open=true]:translate-x-0 lg:right-6 lg:top-6 lg:bottom-6 lg:z-20 lg:w-60 lg:translate-x-0 lg:rounded-2xl lg:border lg:shadow-[0_8px_24px_rgba(16,24,40,0.04)]"
      aria-label="منوی اصلی"
      data-component="sidebar"
      data-open="false"
      data-mode="responsive"
      style="background-color: var(--surface)"
    >
      <div
        id="sidebar-mobile-head"
        class="flex h-14 items-center justify-between border-b border-border px-4 lg:hidden"
        data-region="sidebar-mobile-head"
      >
        <button
          id="sidebar-close"
          type="button"
          class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-on-background transition-all duration-200 ease-out hover:bg-primary-hover/10 hover:text-primary-hover active:scale-95 focus:outline-none focus:ring-2 focus:ring-primary-hover/30"
          aria-label="بستن منوی کناری"
          data-action="close-sidebar"
        >
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="m7 7 10 10M17 7 7 17" />
          </svg>
        </button>
        <p class="text-sm font-bold">کوئرا لیست</p>
        <span class="w-9" aria-hidden="true"></span>
      </div>

      <div
        id="user-summary"
        class="mx-3 mt-3 flex min-h-24 items-center gap-3 rounded-xl px-4 py-4 lg:mx-3 lg:mt-3 lg:min-h-24"
        data-region="user-summary"
      >
        <img
          id="user-avatar"
          src="./assets/img/user-avatar.png"
          alt="تصویر پروفایل رویا"
          class="h-11 w-11 shrink-0 rounded-full border border-border object-cover object-center ring-1 ring-border"
          data-avatar="image"
        />

        <div class="min-w-0 flex-1">
          <p
            id="user-greeting"
            class="truncate text-[14px] font-extrabold leading-6"
            data-user-name="رویا"
          >
            سلام، رویا</p>
          <p
            id="today-label"
            class="mt-0.5 truncate text-[11px] leading-5 text-muted"
            data-date-source="js"
          >
            امروز چهارشنبه، ۸ مهر ۱۴۰۵
          </p>
        </div>
      </div>

      <nav
        id="primary-nav"
        class="px-3 pt-4 lg:px-3.5 lg:pt-3"
        aria-label="ناوبری اصلی"
        data-region="primary-nav"
      >
        <a
          id="nav-home"
          href="#"
          class="group flex h-10 items-center gap-3 rounded-lg bg-primary-hover/10 px-3 text-[13px] font-bold text-primary-hover shadow-[inset_0_0_0_1px_rgba(7,92,217,0.02)] transition-all duration-300 ease-out hover:bg-primary-hover/15 hover:shadow-sm active:scale-[0.98] focus:bg-primary-hover/20 focus:outline-none focus:ring-2 focus:ring-primary-hover/15"
          aria-current="page"
          data-nav="home"
          data-active="true"
        >
          <svg
            class="h-5 w-5 shrink-0"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"
            />
          </svg>
          <span>خانه</span>
        </a>

        <a
          id="nav-tasks"
          href="#"
          class="group mt-1 flex h-10 items-center gap-3 rounded-lg px-3 text-[13px] text-on-background transition-all duration-300 ease-out hover:translate-x-[-2px] hover:bg-[var(--neutral-200)] hover:text-primary-hover active:scale-[0.98] active:bg-primary-hover/15 focus:bg-primary-hover/10 focus:text-primary-hover focus:outline-none focus:ring-2 focus:ring-primary-hover/10 dark:hover:bg-primary-hover/10 dark:focus:bg-primary-hover/10"
          data-nav="tasks"
          data-active="false"
        >
          <svg
            class="h-[18px] w-[18px] shrink-0 text-muted transition-colors duration-300 group-hover:text-primary-hover group-focus:text-primary-hover"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="4" y="4" width="16" height="16" rx="4" />
            <path d="M8 9h8M8 13h5" />
          </svg>
          <span>تسک‌ها</span>
        </a>

        <a
          id="nav-calendar"
          href="#"
          class="group mt-1 flex h-10 items-center gap-3 rounded-lg px-3 text-[13px] text-on-background transition-all duration-300 ease-out hover:translate-x-[-2px] hover:bg-[var(--neutral-200)] hover:text-primary-hover active:scale-[0.98] active:bg-primary-hover/15 focus:bg-primary-hover/10 focus:text-primary-hover focus:outline-none focus:ring-2 focus:ring-primary-hover/10 dark:hover:bg-primary-hover/10 dark:focus:bg-primary-hover/10"
          data-nav="calendar"
          data-active="false"
        >
          <svg
            class="h-[18px] w-[18px] shrink-0 text-muted transition-colors duration-300 group-hover:text-primary-hover group-focus:text-primary-hover"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="4" y="5" width="16" height="15" rx="3" />
            <path d="M8 3v4M16 3v4M4 10h16" />
          </svg>
          <span>تقویم</span>
        </a>

        <a
          id="nav-reports"
          href="#"
          class="group mt-1 flex h-10 items-center gap-3 rounded-lg px-3 text-[13px] text-on-background transition-all duration-300 ease-out hover:translate-x-[-2px] hover:bg-[var(--neutral-200)] hover:text-primary-hover active:scale-[0.98] active:bg-primary-hover/15 focus:bg-primary-hover/10 focus:text-primary-hover focus:outline-none focus:ring-2 focus:ring-primary-hover/10 dark:hover:bg-primary-hover/10 dark:focus:bg-primary-hover/10"
          data-nav="reports"
          data-active="false"
        >
          <svg
            class="h-[18px] w-[18px] shrink-0 text-muted transition-colors duration-300 group-hover:text-primary-hover group-focus:text-primary-hover"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="4" y="4" width="16" height="16" rx="3" />
            <path d="M8 16v-3M12 16V8M16 16v-6" />
          </svg>
          <span>گزارشات</span>
        </a>

        <a
          id="nav-settings"
          href="#"
          class="group mt-1 flex h-10 items-center gap-3 rounded-lg px-3 text-[13px] text-on-background transition-all duration-300 ease-out hover:translate-x-[-2px] hover:bg-[var(--neutral-200)] hover:text-primary-hover active:scale-[0.98] active:bg-primary-hover/15 focus:bg-primary-hover/10 focus:text-primary-hover focus:outline-none focus:ring-2 focus:ring-primary-hover/10 dark:hover:bg-primary-hover/10 dark:focus:bg-primary-hover/10"
          data-nav="settings"
          data-active="false"
        >
          <svg
            class="h-[18px] w-[18px] shrink-0 text-muted transition-colors duration-300 group-hover:text-primary-hover group-focus:text-primary-hover"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.3 3.1a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L5.1 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 3.1h5l.3-3.1a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5c.1-.3.1-.7.1-1Z"
            />
          </svg>
          <span>تنظیمات</span>
        </a>

        <a
          id="nav-support"
          href="#"
          class="group mt-1 flex h-10 items-center gap-3 rounded-lg px-3 text-[13px] text-on-background transition-all duration-300 ease-out hover:translate-x-[-2px] hover:bg-[var(--neutral-200)] hover:text-primary-hover active:scale-[0.98] active:bg-primary-hover/15 focus:bg-primary-hover/10 focus:text-primary-hover focus:outline-none focus:ring-2 focus:ring-primary-hover/10 dark:hover:bg-primary-hover/10 dark:focus:bg-primary-hover/10"
          data-nav="support"
          data-active="false"
        >
          <svg
            class="h-[18px] w-[18px] shrink-0 text-muted transition-colors duration-300 group-hover:text-primary-hover group-focus:text-primary-hover"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M6 18h-1a2 2 0 0 1-2-2v-4a9 9 0 0 1 18 0v4a2 2 0 0 1-2 2h-1"
            />
            <path d="M7 14v4M17 14v4M9 20h6" />
          </svg>
          <span>پشتیبانی</span>
        </a>

        <a
          id="nav-profile"
          href="#"
          class="group mt-1 flex h-10 items-center gap-3 rounded-lg px-3 text-[13px] text-on-background transition-all duration-300 ease-out hover:translate-x-[-2px] hover:bg-[var(--neutral-200)] hover:text-primary-hover active:scale-[0.98] active:bg-primary-hover/15 focus:bg-primary-hover/10 focus:text-primary-hover focus:outline-none focus:ring-2 focus:ring-primary-hover/10 dark:hover:bg-primary-hover/10 dark:focus:bg-primary-hover/10"
          data-nav="profile"
          data-active="false"
        >
          <svg
            class="h-[18px] w-[18px] shrink-0 text-muted transition-colors duration-300 group-hover:text-primary-hover group-focus:text-primary-hover"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="8" r="3" />
            <path d="M5.5 20a6.5 6.5 0 0 1 13 0" />
          </svg>
          <span>پروفایل</span>
        </a>
      </nav>

      <div
        id="sidebar-footer"
        class="mt-auto px-3 pb-4 lg:px-3.5 lg:pb-4"
        data-region="sidebar-footer"
      >
        <div
          id="theme-switcher"
          class="mb-0 flex h-10 items-center gap-1 rounded-lg bg-[var(--neutral-200)] p-1 dark:bg-background"
          data-region="theme-switcher"
          data-theme-control="true"
        >
          <button
            id="theme-light"
            type="button"
            class="flex h-8 flex-1 items-center justify-center gap-1.5 rounded-md bg-white text-[12px] font-semibold text-on-background shadow-sm transition-all duration-200 hover:-translate-y-px dark:bg-transparent dark:text-muted dark:shadow-none"
            data-action="set-theme"
            data-theme="light"
            aria-label="حالت روشن"
            aria-pressed="true"
            onclick="document.documentElement.classList.remove('dark');localStorage.setItem('theme','light');this.setAttribute('aria-pressed','true');document.getElementById('theme-dark').setAttribute('aria-pressed','false')"
          >
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <span>روشن</span>
          </button>

          <button
            id="theme-dark"
            type="button"
            class="flex h-8 flex-1 items-center justify-center gap-1.5 rounded-md text-[12px] font-semibold text-muted transition-all duration-200 hover:-translate-y-px dark:bg-surface dark:text-on-background dark:shadow-sm"
            data-action="set-theme"
            data-theme="dark"
            aria-label="حالت تاریک"
            aria-pressed="false"
            onclick="document.documentElement.classList.add('dark');localStorage.setItem('theme','dark');this.setAttribute('aria-pressed','true');document.getElementById('theme-light').setAttribute('aria-pressed','false')"
          >
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z" />
            </svg>
            <span>تاریک</span>
          </button>
        </div>
        <div class="my-3 h-px w-full bg-border" aria-hidden="true"></div>
        <button
          id="logout-button"
          type="button"
          class="group flex h-10 w-full items-center gap-3 rounded-lg px-3 text-[13px] text-on-background transition-all duration-200 hover:bg-[var(--neutral-200)] hover:text-primary-hover active:scale-[0.98] dark:hover:bg-primary-hover/10"
          data-action="logout"
        >
          <svg
            class="h-[18px] w-[18px] shrink-0 text-muted transition-colors duration-300 group-hover:text-primary-hover group-focus:text-primary-hover"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M14 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-3"
            />
            <path d="M21 12H10M13 9l-3 3 3 3" />
          </svg>
          <span>خروج</span>
        </button>
      </div>
    </aside>
  </body>
</html>
